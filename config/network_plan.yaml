site_name: SmartBranch 360

vlans:
  - id: 10
    name: Employee
    subnet: 10.10.10.0/24
    gateway: 10.10.10.1
    dhcp_pool: EMPLOYEE_POOL
  - id: 20
    name: Guest
    subnet: 10.10.20.0/24
    gateway: 10.10.20.1
    dhcp_pool: GUEST_POOL
  - id: 30
    name: Server
    subnet: 10.10.30.0/24
    gateway: 10.10.30.1
    dhcp_pool: null
  - id: 99
    name: Management
    subnet: 10.10.99.0/24
    gateway: 10.10.99.1
    dhcp_pool: null

trunks:
  - device: SW1
    interface: GigabitEthernet0/1
    allowed_vlans: [10, 20, 30, 99]
  - device: SW1
    interface: GigabitEthernet0/2
    allowed_vlans: [10, 20, 30, 99]
  - device: SW2
    interface: GigabitEthernet0/1
    allowed_vlans: [10, 20, 30, 99]

security:
  - source: Guest
    destination: Server
    action: DENY
  - source: Guest
    destination: Management
    action: DENY
  - source: Employee
    destination: Management
    action: DENY
  - source: Management
    destination: SSH
    action: ALLOW

nat:
  inside_interfaces: ["GigabitEthernet0/0.10", "GigabitEthernet0/0.20", "GigabitEthernet0/0.30", "GigabitEthernet0/0.99"]
  outside_interface: "GigabitEthernet0/1"
  acl: NAT_ACL

ssh:
  enabled: true
  allowed_vlan: 99
